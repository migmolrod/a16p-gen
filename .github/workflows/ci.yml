name: ci

# No master here: under git flow master only receives tagged release/hotfix
# merges, and release.yml runs `mise run ci` on every tag before publishing,
# so running it again for the master push would test the same commit twice.
on:
  push:
    branches: [develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci
