[package]
name = "a16p"
version = "0.1.0"
edition = "2026"
description = "Wallpaper-anchored ANSI16 palette generator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/migmolrod/a16p-gen"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "rayon",
] }
minijinja = "2.23.0"
palette = "0.7.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[profile.release]
strip = true
lto = "thin"
