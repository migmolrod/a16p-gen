[tools]
rust = { version = "1.97", components = "rustfmt,clippy", targets = "x86_64-unknown-linux-musl" }

[tasks.build]
description = "Build debug binary"
run = "cargo build"
alias = "b"

[tasks.release]
description = "Build release binary"
run = "cargo build --release"

[tasks.dist]
description = "Build the static release tarball + checksum into dist/ (what CI uploads)"
run = """
#!/usr/bin/env bash
set -euo pipefail
target=x86_64-unknown-linux-musl
# Asset names carry no version on purpose: install.sh fetches
# releases/latest/download/<name>, so renaming these breaks it.
name="a16p-$target"
cargo build --release --locked --target "$target"
rm -rf dist
mkdir -p "dist/$name"
cp "target/$target/release/a16p" LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
tar -C dist -czf "dist/$name.tar.gz" "$name"
(cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
echo "built dist/$name.tar.gz"
"""

[tasks.release-tag]
description = "Run CI checks, then create an annotated v<version> tag from Cargo.toml (does not push)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -n "$(git status --porcelain)" ]; then
  echo "working tree is dirty; commit or stash first" >&2
  exit 1
fi
version="$(cargo pkgid | sed 's/.*[#@]//')"
tag="v$version"
if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
  echo "tag $tag already exists; bump version in Cargo.toml first" >&2
  exit 1
fi
mise run ci
git tag -a "$tag" -m "a16p $tag"
echo "created $tag -- publish the release with: git push --follow-tags"
"""

[tasks.test]
description = "Run unit tests"
run = "cargo test"
alias = "t"

[tasks.lint]
description = "Lint with clippy"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Format source"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "cargo fmt -- --check"

[tasks.ci]
description = "Run everything CI would run"
depends = ["fmt-check", "lint", "test"]

[tasks.preview]
description = "Preview a palette in the terminal without writing files: mise run preview -- ./wallpaper.jpg"
run = "cargo run -- preview"

[tasks.generate]
description = "Generate primitives.json + semantic.json: mise run generate -- ./wallpaper.jpg -o ./out"
run = "cargo run -- generate"

[tasks."config-init"]
description = "Write a commented default config to the XDG config path (pass -- --force to overwrite)"
run = "cargo run -- config init"

[tasks."config-path"]
description = "Print the resolved XDG config path"
run = "cargo run -q -- config path"
